<head>

    .container { max-width: 900px; margin: 0 auto; }
    .voice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }
    .voice-card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .voice-name {
      font-size: 1.3em;
      font-weight: bold;
      margin: 10px 0;
      color: #34495e;
    }
    audio { width: 100%; margin-top: 10px; }
    button {
      margin-top: 8px;
      padding: 8px 16px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #2980b9; }
  </style>
</head>
